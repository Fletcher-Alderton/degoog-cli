[package]
name = "degoog-cli"
version = "0.1.0"
edition = "2021"
description = "Local CLI and stdio MCP server for a remote Degoog instance"
license = "AGPL-3.0-only"

[[bin]]
name = "degoog"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
ego-tree = "0.10"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-std", "io-util", "sync", "signal"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
strip = true
